# apercel: open-source PowerVR kernel driver (GPLv2).
# Never load the closed-source pvrsrvkm module.
blacklist pvrsrvkm
# Load dependency helper modules first (their symbols are imported).
softdep apercel pre: gpu_sched drm_exec drm_shmem_helper
# Keep GPU permanently awake for consistent latency (matches previous setup).
options apercel no_autosuspend=1
